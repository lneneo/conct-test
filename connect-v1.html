        linear-gradient(45deg,  rgba(255,255,255,0.03) 1px, transparent 1px),

      background-size: 80px 80px, 80px 80px, 80px 80px, 80px 80px;
    }
    #bg-grid::after {
      content: '';
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;

      opacity: 0.4; pointer-events: none;
    }
    @media (max-width: 600px) {
      #bg-grid { background-size: 60px 60px, 60px 60px, 60px 60px, 60px 60px; }
      #bg-grid::after { background-size: 60px 60px; }
    }
    /* Light mode invert */
    #bg-grid[data-mode="light"] {
      background-image:
        linear-gradient(rgba(0,0,0,0.10) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.10) 1px, transparent 1px),

    import * as THREE from 'three';

    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
    import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';

    // ─── NucleusBoopProcessor AudioWorklet (Blob URL pattern) ────────────────

    const WORKLET_CODE = `
class NucleusBoopProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this._voices = [];
    this.port.onmessage = (e) => {
      if (e.data.trigger && this._voices.length < 16) {
        const { freq, attackMs, decayMs, gain, type } = e.data.trigger;
        this._voices.push({
          freq, phase: 0, gain: gain || 0.25, type: type || 'sine',
          attackSamp: Math.floor(attackMs * sampleRate / 1000),
          totalSamp:  Math.floor((attackMs + decayMs) * sampleRate / 1000),
          sample: 0,
        });
      }
    };
  }
  _sample(v) {
    const p = v.phase * Math.PI * 2;
    if (v.type === 'triangle') {
      return 2 * Math.abs(2 * (v.phase - Math.floor(v.phase + 0.5))) - 1;
    }
    if (v.type === 'additive') {
      // fundamental + octave (0.5) + fifth (0.3) — warm organ-like
      return Math.sin(p) + Math.sin(p * 2) * 0.5 + Math.sin(p * 3) * 0.3;
    }
    return Math.sin(p);
  }
  process(inputs, outputs) {
    const out = outputs[0][0];
    if (!out) return true;
    this._voices = this._voices.filter(v => v.sample < v.totalSamp);
    for (let i = 0; i < out.length; i++) {
      let s = 0;
      for (const v of this._voices) {
        const env = v.sample < v.attackSamp
          ? v.sample / v.attackSamp
          : 1.0 - (v.sample - v.attackSamp) / (v.totalSamp - v.attackSamp);
        v.phase += v.freq / sampleRate;
        if (v.phase > 1) v.phase -= 1;
        s += this._sample(v) * Math.max(0, env) * v.gain;
        v.sample++;
      }
      out[i] = s * 0.55;
    }
    return true;
  }
}
registerProcessor('nucleus-boop', NucleusBoopProcessor);
`;

    const PITCH_MID  = [196, 220, 261, 294, 330, 349, 392, 415, 440]; // ~G3–A4

    function soulPrint(address) {

      const envGene      = Math.floor(seed / 12) % ENVS.length;
      return {
        pool:  [PITCH_BASS, PITCH_MID, PITCH_HIGH][registerGene],
        type:  VOICE_TYPES[voiceGene],
        env:   ENVS[envGene],
      };
    }

        return {

          decayMs,
          stepLen,

          attackMs: env.attackMs,

      for (let i = 0; i < count; i++) {

        const phi   = Math.acos(2 * seededRandom(i * 7 + 2) - 1);
        positions.push({

    // ─── BCC Bravais lattice — pre-computed positions + adjacency ─────────────
    const bccData = (() => {
      const n = 4;
      const raw = [];
      for (let i = 0; i <= n; i++)
        for (let j = 0; j <= n; j++)
          for (let k = 0; k <= n; k++)
            raw.push([i/n, j/n, k/n]);
      for (let i = 0; i < n; i++)
        for (let j = 0; j < n; j++)
          for (let k = 0; k < n; k++)
            raw.push([(i+0.5)/n, (j+0.5)/n, (k+0.5)/n]);
      raw.sort((a, b) => {
        const da=(a[0]-.5)**2+(a[1]-.5)**2+(a[2]-.5)**2;
        const db=(b[0]-.5)**2+(b[1]-.5)**2+(b[2]-.5)**2;
        return da-db;
      });
      const pos = raw.map(([x,y,z]) => ({ fx:0.15+x*0.7, fy:0.15+y*0.7, fz:0.15+z*0.7 }));
      // Threshold captures both BCC body-diagonal (d≈0.152) AND cube edges (d≈0.175)
      const nnDist = (1/n)*0.7*1.08;
      const adj = pos.map(()=>[]);
      for (let i = 0; i < pos.length; i++)
        for (let j = i+1; j < pos.length; j++) {
          const dx=pos[i].fx-pos[j].fx, dy=pos[i].fy-pos[j].fy, dz=pos[i].fz-pos[j].fz;
          if (Math.sqrt(dx*dx+dy*dy+dz*dz) < nnDist) { adj[i].push(j); adj[j].push(i); }
        }
      return { pos, adj };
    })();

    // Cluster anchor — one per minter, placed on BCC lattice node
    // Cluster anchors evenly distributed on a sphere via Fibonacci/golden angle
    function calcMinterAnchor(minterId, minterCount) {
      if (minterCount < 2) return { fx: 0.5, fy: 0.5, fz: 0.5 };
      const golden = Math.PI * (3 - Math.sqrt(5));
      const y      = 1 - (minterId / (minterCount - 1)) * 2;
      const r      = Math.sqrt(Math.max(0, 1 - y * y));
      const theta  = golden * minterId;
      return {
        fx: 0.5 + CFG.CLUMP_DISTANCE * r * Math.cos(theta),
        fy: 0.5 + CFG.CLUMP_DISTANCE * y,
        fz: 0.5 + CFG.CLUMP_DISTANCE * r * Math.sin(theta),
      };
    }

    // Nuclei within a cluster — tight sphere around their anchor
    function calcClusterPositions(count, anchor, minterId) {
      const spread = CFG.CLUSTER_SPREAD;
      const positions = [];
      for (let j = 0; j < count; j++) {
        const seed  = minterId * 1000 + j;
        const r     = spread * seededRandom(seed * 7);
        const theta = seededRandom(seed * 7 + 1) * Math.PI * 2;
        const phi   = Math.acos(2 * seededRandom(seed * 7 + 2) - 1);
        positions.push({
          fx: Math.max(0.1, Math.min(0.9, anchor.fx + r * Math.sin(phi) * Math.cos(theta))),
          fy: Math.max(0.1, Math.min(0.9, anchor.fy + r * Math.sin(phi) * Math.sin(theta))),
          fz: Math.max(0.1, Math.min(0.9, anchor.fz + r * Math.cos(phi))),
        });
      }
      return positions;
    }

      return {
        dx: radius * Math.cos(t * speed + px),
        dy: radius * Math.sin(t * speed * 0.7 + py),
        dz: radius * Math.sin(t * speed * 0.5 + px + py),

    // ─── Fresnel shaders (unchanged from v6) ───────────────────────────────────

    const fresnelVert = `
      varying vec3 vNormal;
      varying vec3 vViewDir;
      varying vec3 vWorldPos;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
        vViewDir = normalize(-mvPos.xyz);
        vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz;
        gl_Position = projectionMatrix * mvPos;

      uniform vec3  rimColor;
      uniform float rimPower;
      uniform float rimIntensity;
      uniform vec3  rippleCenter;
      uniform float rippleTime;
      uniform float rippleStrength;
      uniform float rippleMono;
      varying vec3  vNormal;
      varying vec3  vViewDir;
      varying vec3  vWorldPos;

      void main() {
        float rim = 1.0 - abs(dot(normalize(vNormal), normalize(vViewDir)));
        rim = pow(rim, rimPower);

        // Ink drop diffusion — gaussian stain expanding from tap point
        float dist    = length(vWorldPos - rippleCenter);
        float spread  = 0.28 + rippleTime * 0.80;
        float gauss   = exp(-(dist * dist) / (spread * spread));
        float fade    = exp(-rippleTime * 0.75) * rippleStrength;

      for (let i = 0; i < N_RING; i++) {
        const a0 = (i / N_RING) * Math.PI * 2, a1 = ((i + 1) / N_RING) * Math.PI * 2;
        ringPos[i*6+0] = Math.cos(a0)*RING_R; ringPos[i*6+1] = Math.sin(a0)*RING_R; ringPos[i*6+2] = 0;
        ringPos[i*6+3] = Math.cos(a1)*RING_R; ringPos[i*6+4] = Math.sin(a1)*RING_R; ringPos[i*6+5] = 0;
      }
      const sharedRingGeo = new LineSegmentsGeometry();
      sharedRingGeo.setPositions(ringPos);
      nucleiMeshes.forEach((mesh) => {
        const mat = new LineMaterial({
          color: PALETTE[minters[mesh.userData.minterId].colorIdx].hex,
          linewidth: CFG.CONNECTOR_WIDTH,
          transparent: true, opacity: 0.8, depthWrite: false,
          resolution: new THREE.Vector2(window.innerWidth, window.innerHeight),
        });
        const ring = new LineSegments2(sharedRingGeo, mat);
        ring.frustumCulled = false;
        ring.renderOrder = 4;
        ring.visible = false;
        nucleiGroup.add(ring);
        activeRings.push({ ring, mesh, mat });
      });

    }

    // ─── GLB export ────────────────────────────────────────────────────────────
    const TUBE_RADIUS   = 0.004;
    const TUBE_SEGMENTS = 4;

    function buildConnectorTubes() {
      const tubes = [];
      const nm = minters.length;
      if (nm < 2 || !showScaffold) return tubes;
      const drawn = new Set();
      const K = Math.min(3, nm - 1);
      for (let mi = 0; mi < nm; mi++) {
        const ai = bccData.pos[mi];
        const color = new THREE.Color(PALETTE[minters[mi].colorIdx].hex);
        const dists = [];
        for (let mj = 0; mj < nm; mj++) {
          if (mj === mi) continue;
          const aj = bccData.pos[mj];
          const dx = ai.fx - aj.fx, dy = ai.fy - aj.fy, dz = ai.fz - aj.fz;
          dists.push({ mj, d: dx*dx + dy*dy + dz*dz });
        }
        dists.sort((a, b) => a.d - b.d);
        for (let k = 0; k < K; k++) {
          const mj  = dists[k].mj;
          const key = Math.min(mi, mj) * 1000 + Math.max(mi, mj);
          if (drawn.has(key)) continue;
          drawn.add(key);
          let bestD2 = Infinity, pi = null, pj = null;
          for (const ma of nucleiMeshes) {
            if (ma.userData.minterId !== mi) continue;
            for (const mb of nucleiMeshes) {
              if (mb.userData.minterId !== mj) continue;
              const d2 = ma.position.distanceToSquared(mb.position);
              if (d2 < bestD2) { bestD2 = d2; pi = ma.position.clone(); pj = mb.position.clone(); }
            }
          }
          if (!pi) continue;
          const len = pi.distanceTo(pj);
          if (len < 0.001) continue;
          const mid = new THREE.Vector3().addVectors(pi, pj).multiplyScalar(0.5);
          const tubeGeo = new THREE.CylinderGeometry(TUBE_RADIUS, TUBE_RADIUS, len, TUBE_SEGMENTS, 1);
          tubeGeo.rotateX(Math.PI / 2);
          const tubeMat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.3, roughness: 0.6, metalness: 0.2, transparent: true, opacity: 0.7 });
          const tubeMesh = new THREE.Mesh(tubeGeo, tubeMat);
          tubeMesh.position.copy(mid); tubeMesh.lookAt(pj);
          tubes.push(tubeMesh);
        }
        const cluster = nucleiMeshes.filter(m => m.userData.minterId === mi);
        for (const ma of cluster) {
          let bestD2 = Infinity, nearest = null;
          for (const mb of cluster) {
            if (mb === ma) continue;
            const d2 = ma.position.distanceToSquared(mb.position);
            if (d2 < bestD2) { bestD2 = d2; nearest = mb; }
          }
          if (!nearest) continue;
          const ikey = ma.userData.globalIdx * 10000 + nearest.userData.globalIdx;
          if (drawn.has(ikey)) continue;
          drawn.add(ikey);
          const len = ma.position.distanceTo(nearest.position);
          if (len < 0.001) continue;
          const mid = new THREE.Vector3().addVectors(ma.position, nearest.position).multiplyScalar(0.5);
          const tubeGeo = new THREE.CylinderGeometry(TUBE_RADIUS, TUBE_RADIUS, len, TUBE_SEGMENTS, 1);
          tubeGeo.rotateX(Math.PI / 2);
          const tubeMat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.4, roughness: 0.5, metalness: 0.2, transparent: true, opacity: 0.7 });
          const tubeMesh = new THREE.Mesh(tubeGeo, tubeMat);
          tubeMesh.position.copy(mid); tubeMesh.lookAt(nearest.position);
          tubes.push(tubeMesh);
        }
      }
      return tubes;
    }

      const btn = document.getElementById('btn-glb-corner');

    // ─── updateConnectorLines — routes intra vs inter by minterId ──────────────

    function updateConnectorLines(meshes) {
      intraLinesList.forEach(({ geo }) => { geo.instanceCount = 0; });
      interLineGeo.instanceCount = 0;
      const nm = minters.length;
      if (nm < 1) return;

      const intraIdx = new Array(CFG.MAX_MINTERS).fill(0);
      const drawn    = new Set();
      const K        = Math.min(3, nm - 1); // each minter connects to 3 nearest minter-neighbours

      // For each minter, find K nearest minter anchors and draw one line to each
      for (let mi = 0; mi < nm; mi++) {
        const ai = bccData.pos[mi];

        // Sort other minters by anchor distance
        const dists = [];
        for (let mj = 0; mj < nm; mj++) {
          if (mj === mi) continue;
          const aj = bccData.pos[mj];
          const dx = ai.fx - aj.fx, dy = ai.fy - aj.fy, dz = ai.fz - aj.fz;
          dists.push({ mj, d: dx*dx + dy*dy + dz*dz });
        }
        dists.sort((a, b) => a.d - b.d);

        for (let k = 0; k < K; k++) {
          const mj  = dists[k].mj;
          const key = Math.min(mi, mj) * 1000 + Math.max(mi, mj);
          if (drawn.has(key)) continue;
          drawn.add(key);

          // Closest nucleus pair between mi and mj
          let bestD2 = Infinity, pi = null, pj = null;
          for (const ma of meshes) {
            if (ma.userData.minterId !== mi) continue;
            for (const mb of meshes) {
              if (mb.userData.minterId !== mj) continue;
              const d2 = ma.position.distanceToSquared(mb.position);
              if (d2 < bestD2) { bestD2 = d2; pi = ma.position; pj = mb.position; }
            }
          }
          if (!pi) continue;
          const idx = intraIdx[mi];
          const { buf } = intraLinesList[mi];
          buf[idx*6+0]=pi.x; buf[idx*6+1]=pi.y; buf[idx*6+2]=pi.z;
          buf[idx*6+3]=pj.x; buf[idx*6+4]=pj.y; buf[idx*6+5]=pj.z;
          intraIdx[mi]++;
        }

        // Intra-cluster: each nucleus connects to its nearest neighbour within the same minter
        const cluster = meshes.filter(m => m.userData.minterId === mi);
        for (const ma of cluster) {
          let bestD2 = Infinity, nearest = null;
          for (const mb of cluster) {
            if (mb === ma) continue;
            const d2 = ma.position.distanceToSquared(mb.position);
            if (d2 < bestD2) { bestD2 = d2; nearest = mb; }
          }
          if (!nearest) continue;
          const ikey = ma.userData.globalIdx * 10000 + nearest.userData.globalIdx;
          if (drawn.has(ikey)) continue;
          drawn.add(ikey);
          const idx = intraIdx[mi];
          const { buf } = intraLinesList[mi];
          buf[idx*6+0]=ma.position.x; buf[idx*6+1]=ma.position.y; buf[idx*6+2]=ma.position.z;
          buf[idx*6+3]=nearest.position.x; buf[idx*6+4]=nearest.position.y; buf[idx*6+5]=nearest.position.z;
          intraIdx[mi]++;
        }
      }

      intraLinesList.forEach(({ geo }, i) => {
        geo.attributes.instanceStart.data.needsUpdate = true;
        geo.instanceCount = intraIdx[i];
      });
    }

    async function initAudio() {
      if (audioCtx) return;
      audioCtx = new AudioContext();
      try {
        const masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(0, audioCtx.currentTime);
        masterGain.gain.linearRampToValueAtTime(0.7, audioCtx.currentTime + 4.0);
        masterGain.connect(audioCtx.destination);
        audioMasterGain = masterGain;

        const compressor = audioCtx.createDynamicsCompressor();
        compressor.threshold.value = -18; compressor.ratio.value = 6;
        compressor.connect(masterGain);

        const makeDelay = (time, fb) => {
          const d = audioCtx.createDelay(1.0); d.delayTime.value = time;
          const f = audioCtx.createGain(); f.gain.value = fb;
          d.connect(f); f.connect(d); return d;
        };
        const d1 = makeDelay(0.18, 0.35), d2 = makeDelay(0.27, 0.35);
        const rev = audioCtx.createGain(); rev.gain.value = 0.4;
        d1.connect(rev); d2.connect(rev); rev.connect(compressor);

        analyserNode = audioCtx.createAnalyser();
        analyserNode.fftSize = 512;
        analyserNode.connect(compressor);

        // Nucleus boop synth — routes through delay+compressor
        try {
          const blob    = new Blob([WORKLET_CODE], { type: 'application/javascript' });
          const blobURL = URL.createObjectURL(blob);
          await audioCtx.audioWorklet.addModule(blobURL);
          URL.revokeObjectURL(blobURL);

          nucleusBoopNode = new AudioWorkletNode(audioCtx, 'nucleus-boop');
          const boopGain = audioCtx.createGain();
          boopGain.gain.value = 0.8;
          nucleusBoopGain = boopGain;
          nucleusBoopNode.connect(boopGain);
          boopGain.connect(analyserNode);
          boopGain.connect(d1);
          boopGain.connect(d2);
        } catch (_) { nucleusBoopNode = null; }

        audioReady = true;
        audioCtx.resume();
      } catch (e) { audioCtx = null; }
    }

      }

      const count = Math.min(minters.length, 1 + Math.floor(Math.random() * 5));
      const shuffled = minters.map((_, i) => i).sort(() => Math.random() - 0.5).slice(0, count);
      for (const id of shuffled) await toggleVoice(id);
      // Wait 8–12s — long enough for a 12-note chain to complete
      const wait = 8000 + Math.random() * 4000;
      autoplayTimer = setTimeout(autoplayStep, wait);
    }

    document.getElementById('btn-autoplay').addEventListener('click', async () => {
      autoplayActive = !autoplayActive;
      const btn  = document.getElementById('btn-autoplay');
      const play = document.getElementById('autoplay-play');
      const stop = document.getElementById('autoplay-stop');
      if (autoplayActive) {
        btn.classList.add('is-playing');
        play.setAttribute('display', 'none');
        stop.removeAttribute('display');
        if (!audioCtx) { await initAudio(); audioMuted = false; updateSoundBtn(); }
        autoplayStep();
      } else {
        btn.classList.remove('is-playing');
        play.removeAttribute('display');
        stop.setAttribute('display', 'none');
        clearTimeout(autoplayTimer); autoplayTimer = null;
      }
    });

    // ─── Interaction ───────────────────────────────────────────────────────────

    let pulseStartTime = -999;
    const PULSE_DURATION = 2.5;
    let tapOrigin = { x: 0, y: 0 };
    let isHolding = false;
    let lastTapTime = 0;
    let tapLfoRate  = 0.4;  // resting heartbeat ~0.4 Hz
    let holdTimer  = null, holdRemoveInterval = null;
    let rippleStartTime = -10.0;
    const rippleTapPos  = new THREE.Vector3();

    // ─── Nucleus click — raycaster + wallet info overlay ───────────────────────

    const raycaster  = new THREE.Raycaster();
    const ndcPointer = new THREE.Vector2();
    const labelSvg   = document.getElementById('label-svg');
    const activeLabels = new Map(); // minterId → { el, path, timer }
    const LABEL_W = 170, EDGE_PAD = window.innerWidth < 600 ? 10 : 110, LABEL_HALF_H = 40, BEND_R = 20;
    const HORIZ = window.innerWidth < 600 ? 34 : 64;

    // ─── Label zoom state ──────────────────────────────────────────────────────
    let zoomedMinterId = null;
    let camLerp = null; // { toPos, toLook, onComplete }
    const savedCamPos    = new THREE.Vector3();
    const savedCamTarget = new THREE.Vector3();
    const ZOOM_DIST       = 0.8;
    const ZOOM_LERP_SPEED = 0.07;
    const ZOOM_SNAP_DIST  = 0.005;

    function resizeLabelSvg() {
      labelSvg.setAttribute('width',  window.innerWidth);
      labelSvg.setAttribute('height', window.innerHeight);
    }
    resizeLabelSvg();
    window.addEventListener('resize', resizeLabelSvg);

function showMinterLabel(minterId, minter) {
      dismissLabel(minterId, true); // remove existing DOM only — preserve zoom state
      const accent = PALETTE[minter.colorIdx].hex;
      const el = document.createElement('div');
      el.className = 'ni-label';
      el.style.setProperty('--accent', accent);
      // Parse hex → rgba for active state CSS vars (same pattern as table cells)
      const r = parseInt(accent.slice(1,3),16), g = parseInt(accent.slice(3,5),16), b = parseInt(accent.slice(5,7),16);
      el.style.setProperty('--accent-dim', `rgba(${r},${g},${b},0.35)`);
      el.style.setProperty('--accent-mid', `rgba(${r},${g},${b},0.9)`);
      const addrShort = `${minter.address.slice(0,6)}···${minter.address.slice(-4)}`;
      el.innerHTML = `
        <div class="ni-row">
          <div class="ni-dot" style="background:${accent}"></div>
          <span class="ni-address" data-short="${addrShort}" data-full="${minter.address}">${addrShort}</span>
        </div>
        <div class="ni-date">${formatMintDate(minter.mintedAt)}</div>
        <div class="ni-count">${minter.count} mint${minter.count !== 1 ? 's' : ''}</div>`;
      document.body.appendChild(el);

      // Prevent label taps from bubbling to the world pointerup handler
      el.addEventListener('pointerdown', e => e.stopPropagation());
      el.addEventListener('pointerup',   e => e.stopPropagation());
      el.addEventListener('click', e => {
        e.stopPropagation();
        if (zoomedMinterId === minterId) {
          unzoomClump();
        } else {
          // If zoomed into a different label, snap back immediately before zooming here
          if (zoomedMinterId !== null) {
            const prevData = activeLabels.get(zoomedMinterId);
            if (prevData) { prevData.el.classList.remove('ni-active'); prevData.el.style.background = ''; }
            camera.position.copy(savedCamPos);
            controls.target.copy(savedCamTarget);
            controls.enabled = true;
            zoomedMinterId = null;
            camLerp = null;
          }
          zoomToClump(minterId);
        }
      });

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', accent);
      path.setAttribute('stroke-width', '1.5');
      path.setAttribute('opacity', '0.75');
      labelSvg.appendChild(path);

      // If this minter is currently zoomed, re-apply active state on the fresh element
      const isZoomed = minterId === zoomedMinterId;
      let timer;
      if (isZoomed) {
        el.classList.add('ni-active');
        el.style.background = `rgba(${r},${g},${b},0.4)`;
        const addrElZ = el.querySelector('.ni-address');
        if (addrElZ) addrElZ.textContent = addrElZ.dataset.full;
        timer = null; // zoom exempts from auto-dismiss
      } else {
        timer = null; // voice dies naturally after phrase.length cycles — animLoop handles cleanup
      }
      activeLabels.set(minterId, { el, path, timer, minterId });
      syncTableActive();
    }

    function dismissLabel(minterId, preserveZoom = false) {
      // Reset camera unless caller is just refreshing the label (e.g. showMinterLabel, voice end)
      if (!preserveZoom && zoomedMinterId === minterId) {
        camera.position.copy(savedCamPos);
        controls.target.copy(savedCamTarget);
        controls.enabled = true;
        zoomedMinterId = null;
        camLerp = null;
      }
      const label = activeLabels.get(minterId);
      if (!label) return;
      clearTimeout(label.timer);
      label.el.remove();
      label.path.remove();
      activeLabels.delete(minterId);
      syncTableActive();
    }

    function dismissAllLabels() {
      for (const id of [...activeLabels.keys()]) dismissLabel(id);
    }

    function zoomToClump(minterId) {
      // Compute clump world position (average of its nucleus meshes)
      const clumpMeshes = nucleiMeshes.filter(m => m.userData.minterId === minterId);
      if (!clumpMeshes.length) return;
      const clumpPos = new THREE.Vector3();
      clumpMeshes.forEach(m => { const wp = new THREE.Vector3(); m.getWorldPosition(wp); clumpPos.add(wp); });
      clumpPos.divideScalar(clumpMeshes.length);

      // Save current camera state, then aim from current direction at ZOOM_DIST
      savedCamPos.copy(camera.position);
      savedCamTarget.copy(controls.target);
      const dir = camera.position.clone().sub(clumpPos).normalize();
      const targetPos = clumpPos.clone().addScaledVector(dir, ZOOM_DIST);

      zoomedMinterId = minterId;
      controls.enabled = false;

      // Pause the auto-dismiss timer while zoomed; set background directly (CSS var can be unreliable)
      const labelData = activeLabels.get(minterId);
      if (labelData) {
        clearTimeout(labelData.timer);
        labelData.timer = null;
        const accent = PALETTE[minters[minterId].colorIdx].hex;
        const r = parseInt(accent.slice(1,3),16), g = parseInt(accent.slice(3,5),16), b = parseInt(accent.slice(5,7),16);
        labelData.el.classList.add('ni-active');
        labelData.el.style.background = `rgba(${r},${g},${b},0.4)`;
        const addrEl = labelData.el.querySelector('.ni-address');
        if (addrEl) addrEl.textContent = addrEl.dataset.full;
      }

      camLerp = {
        toPos: targetPos,
        toLook: clumpPos,
        onComplete: null, // controls stay disabled — tracking drives camera while zoomed
      };
    }

    function unzoomClump() {
      if (zoomedMinterId === null) return;
      const minterId = zoomedMinterId;

      const labelData = activeLabels.get(minterId);
      if (labelData) {
        labelData.el.classList.remove('ni-active');
        labelData.el.style.background = '';
        const addrEl = labelData.el.querySelector('.ni-address');
        if (addrEl) addrEl.textContent = addrEl.dataset.short;
        clearTimeout(labelData.timer);
        labelData.timer = null; // voice continues naturally after unzoom
      }

      zoomedMinterId = null;
      controls.enabled = false; // keep locked during lerp back

      camLerp = {
        toPos: savedCamPos.clone(),
        toLook: savedCamTarget.clone(),
        onComplete: () => {
          controls.enabled = true;
          // Resync OrbitControls internal spherical state from the restored position
          // without applying any stale damping velocity
          const wasDamping = controls.enableDamping;
          controls.enableDamping = false;
          controls.update();
          controls.enableDamping = wasDamping;
        },
      };
    }

    function updateLabels() {
      if (!activeLabels.size) return;
      const vh = window.innerHeight;
      const _tmpV = new THREE.Vector3();

      // ── Step 1: find screen-Y range of ALL minter anchors (scaffold bounds)
      let scaffMinY = Infinity, scaffMaxY = -Infinity;
      minters.forEach((_, mi) => {
        const a = calcMinterAnchor(mi, minters.length);
        const wp = fieldToWorld(a.fx, a.fy, a.fz, baseBlobScale);
        const ndc = new THREE.Vector3(wp.x, wp.y, wp.z).project(camera);
        const sy = (-ndc.y * 0.5 + 0.5) * vh;
        if (sy < scaffMinY) scaffMinY = sy;
        if (sy > scaffMaxY) scaffMaxY = sy;
      });
      const scaffRange = Math.max(1, scaffMaxY - scaffMinY);
      const TOP_PAD = LABEL_HALF_H, BOT_PAD = LABEL_HALF_H;

      for (const [minterId, label] of activeLabels) {
        // ── Zoomed label: freeze position, hide cable to avoid flicker
        if (minterId === zoomedMinterId) {
          label.path.setAttribute('opacity', '0');
          continue;
        }
        label.path.setAttribute('opacity', '0.75');

        // ── Average world pos of this clump's nuclei
        const clumpMeshes = nucleiMeshes.filter(m => m.userData.minterId === minterId);
        if (!clumpMeshes.length) continue;
        _tmpV.set(0, 0, 0);
        clumpMeshes.forEach(m => { const wp = new THREE.Vector3(); m.getWorldPosition(wp); _tmpV.add(wp); });
        _tmpV.divideScalar(clumpMeshes.length);

        // ── Project clump to screen
        const ndc = _tmpV.clone().project(camera);
        const cx = ( ndc.x * 0.5 + 0.5) * window.innerWidth;
        const cy = (-ndc.y * 0.5 + 0.5) * vh;

        // ── Remap clump screen-Y from scaffold range → full viewport (issue 1)
        // t clamped to [0,1] so single-minter drift can't send label off screen
        const t      = Math.max(0, Math.min(1, (cy - scaffMinY) / scaffRange));
        const labelY = TOP_PAD + t * (vh - TOP_PAD - BOT_PAD);

        const onLeft = cx < window.innerWidth / 2;
        if (onLeft) {
          label.el.className = 'ni-label ni-left';
          label.el.style.left  = EDGE_PAD + 'px';
          label.el.style.right = '';
        } else {
          label.el.className = 'ni-label ni-right';
          label.el.style.right = EDGE_PAD + 'px';
          label.el.style.left  = '';
        }
        label.el.style.top = labelY + 'px';

        // ── Cable: horizontal segment → short rounded bend → straight line to clump
        let pathD;
        if (onLeft) {
          const lx = EDGE_PAD + LABEL_W;  // label right edge
          const sx = lx + HORIZ;          // elbow corner
          // Direction from elbow to clump
          const ddx = cx - sx, ddy = cy - labelY;
          const d   = Math.sqrt(ddx*ddx + ddy*ddy) || 1;
          const r   = Math.min(BEND_R, d * 0.4);
          // Rounded corner: back up r px along incoming (horizontal), forward r px along outgoing
          const bx  = sx + (ddx/d) * r, by = labelY + (ddy/d) * r;
          pathD = `M ${lx},${labelY} L ${sx-r},${labelY} Q ${sx},${labelY} ${bx},${by} L ${cx},${cy}`;
        } else {
          const lx = window.innerWidth - EDGE_PAD - LABEL_W;  // label left edge
          const sx = lx - HORIZ;
          const ddx = cx - sx, ddy = cy - labelY;
          const d   = Math.sqrt(ddx*ddx + ddy*ddy) || 1;
          const r   = Math.min(BEND_R, d * 0.4);
          const bx  = sx + (ddx/d) * r, by = labelY + (ddy/d) * r;
          pathD = `M ${lx},${labelY} L ${sx+r},${labelY} Q ${sx},${labelY} ${bx},${by} L ${cx},${cy}`;
        }
        label.path.setAttribute('d', pathD);
      }
    }

    window.addEventListener('pointerdown', (e) => {
      tapOrigin = { x: e.clientX, y: e.clientY };
      isHolding = false;
      holdTimer = setTimeout(() => {
        isHolding = true;
        // Remove last added cluster immediately, then one more every 800ms
        const removeOne = () => {
          if (nucleusVoices.size === 0) { clearInterval(holdRemoveInterval); holdRemoveInterval = null; return; }
          const minterId = [...nucleusVoices.keys()].at(-1);
          nucleusVoices.delete(minterId);
          dismissLabel(minterId);
        };
        removeOne();
        holdRemoveInterval = setInterval(removeOne, 800);
      }, 300);
    });

    window.addEventListener('pointermove', (e) => {
      if (holdTimer === null) return;
      const dx = e.clientX - tapOrigin.x, dy = e.clientY - tapOrigin.y;
      if (Math.sqrt(dx * dx + dy * dy) > 6) {
        clearTimeout(holdTimer); holdTimer = null; isHolding = false;
      }
    });

    window.addEventListener('pointerup', async (e) => {
      clearTimeout(holdTimer); holdTimer = null;
      clearInterval(holdRemoveInterval); holdRemoveInterval = null;
      const wasHolding = isHolding;
      isHolding = false;

      if (wasHolding) return;

      const dx = e.clientX - tapOrigin.x, dy = e.clientY - tapOrigin.y;
      if (Math.sqrt(dx * dx + dy * dy) > 6) return;
      if (e.target.closest && e.target.closest('#minter-table')) return;
      if (e.target.closest && e.target.closest('.ui-element')) return;
      if (e.target.closest && e.target.closest('.ni-label')) return;

      // Raycast against nucleus meshes — direct tap on a nucleus still toggles it
      ndcPointer.x = (e.clientX / window.innerWidth)  *  2 - 1;
      ndcPointer.y = (e.clientY / window.innerHeight)  * -2 + 1;
      raycaster.setFromCamera(ndcPointer, camera);
      const hits = raycaster.intersectObjects(nucleiMeshes);
      if (hits.length > 0) {
        await toggleVoice(hits[0].object.userData.minterId);
        return;
      }

      // Tap on empty space — add one random silent cluster
      if (!audioCtx) { await initAudio(); audioMuted = false; updateSoundBtn(); }
      const silent = minters.map((m, i) => i).filter(i => !nucleusVoices.has(i));
      if (silent.length > 0) {
        await toggleVoice(silent[Math.floor(Math.random() * silent.length)]);
      }
      pulseStartTime = clock.getElapsedTime();
      const blobHits = raycaster.intersectObject(blobMesh);
      rippleTapPos.copy(blobHits.length > 0 ? blobHits[0].point : new THREE.Vector3(0, 0, baseBlobScale * 0.9));
      rippleStartTime = clock.getElapsedTime();
    });

    // ─── Animation Loop ────────────────────────────────────────────────────────

    const clock = new THREE.Clock();
    let lastFrameMs = performance.now(), fpsSmooth = 60;
    let _lastFrameTime = 0, _frameCount = 0, _lastVoiceKey = '';

    function animLoop(ts) {
      if (ts - _lastFrameTime < 33.3) return; // 30fps cap
      _lastFrameTime = ts;
      _frameCount++;
      const t = clock.getElapsedTime();

      // — Pulse —
      const sinceClick = t - pulseStartTime;
      const pulseBoost = sinceClick < PULSE_DURATION ? 3.8 * Math.exp(-sinceClick * 3.2) : 0;

      // — Animate nuclei: cluster drifts as unit, individual jitter reduced —
      const animFP = nucleiBasePositions.map((b, i) => {
        const minterId = nucleiMeshes[i].userData.minterId;
        const cd = getMinterClusterDrift(minterId, t);
        const o  = getNucleusAnimOffset(i, t);
        return {
          fx: Math.max(0.05, Math.min(0.95, b.fx + cd.dx + o.dx * 0.25)),
          fy: Math.max(0.05, Math.min(0.95, b.fy + cd.dy + o.dy * 0.25)),
          fz: Math.max(0.05, Math.min(0.95, b.fz + cd.dz + o.dz * 0.25)),
        };
      });

      // — Active voice emissive feedback — saturate only the currently sounding nucleus
      // Reset all nuclei to their base palette emissive
      nucleiMeshes.forEach(mesh => {
        const c = new THREE.Color(PALETTE[minters[mesh.userData.minterId].colorIdx].hex);
        const hsl = {};
        c.getHSL(hsl);
        // Light mode: greyscale inactive nuclei (dark on white)
        mesh.material.emissive.setHSL(hsl.h, lightMode ? 0.0 : 0.5, lightMode ? 0.15 : hsl.l);
        mesh.material.color.setHSL(hsl.h,    lightMode ? 0.0 : hsl.s, lightMode ? 0.15 : hsl.l);
        mesh.material.emissiveIntensity = lightMode ? 0.0 : 0.3;
        mesh.material.opacity = 0.85;
      });
      // Restore full saturation on the active nucleus per playing voice
      let _offset = 0;
      minters.forEach((minter, mi) => {
        const voice = nucleusVoices.get(mi);
        if (voice && voice.activeIdx >= 0) {
          const meshIdx = _offset + (voice.activeIdx % minter.count);
          const m = nucleiMeshes[meshIdx];
          if (m) {
            const c = new THREE.Color(PALETTE[minter.colorIdx].hex);
            const hsl = {};
            c.getHSL(hsl);
            m.material.emissive.setHSL(hsl.h, 1.0, hsl.l);
            m.material.color.setHSL(hsl.h, 1.0, hsl.l);
            m.material.emissiveIntensity = lightMode ? 0.8 : 0.5;
          }
        }
        _offset += minter.count;
      });

      // — Update nucleus mesh world positions — counter-rotate scaffold on X axis (gyroscope)
      const cosN = Math.cos(scaffoldAngle), sinN = Math.sin(scaffoldAngle);
      animFP.forEach((fp, i) => {
        const wp = fieldToWorld(fp.fx, fp.fy, fp.fz, baseBlobScale);
        // rotate around X axis
        const ry = wp.y * cosN - wp.z * sinN;
        const rz = wp.y * sinN + wp.z * cosN;
        nucleiMeshes[i].position.set(wp.x, ry, rz);
        nucleiMeshes[i].rotation.y += 0.004 * (0.5 + seededRandom(i * 3));
        nucleiMeshes[i].rotation.x += 0.002 * seededRandom(i * 3 + 1);
      });

      // — Active rings — only on the nucleus currently sounding its note
      const _activeNuclei = new Set();
      let _rOff = 0;
      minters.forEach((minter, mi) => {
        const voice = nucleusVoices.get(mi);
        if (voice && voice.activeIdx >= 0) {
          const idx = _rOff + (voice.activeIdx % minter.count);
          if (nucleiMeshes[idx]) _activeNuclei.add(nucleiMeshes[idx]);
        }
        _rOff += minter.count;
      });
      activeRings.forEach(({ ring, mesh }) => {
        ring.position.copy(mesh.position);
        ring.lookAt(camera.position);
        ring.visible = showScaffold && _activeNuclei.has(mesh);
      });

      // — Connector lines — only recompute on voice change or every 3rd frame
      const _voiceKey = [...nucleusVoices.keys()].sort().join(',');
      if (_voiceKey !== _lastVoiceKey || (_frameCount % 3 === 0 && nucleusVoices.size > 0)) {
        updateConnectorLines(nucleiMeshes);
        _lastVoiceKey = _voiceKey;
      }
      intraLinesList.forEach(({ ls }, mi) => {
        ls.visible = showScaffold && nucleusVoices.has(mi) && zoomedMinterId === null;
      });
      interLinesLS.visible = false;

      // — Blob: central ball dominant + nucleus contributions (inverse-scaled to prevent splitting) —
      const total      = totalCount();
      const bStr       = getBlobStrength(Math.max(1, total));
      const blobScale  = baseBlobScale;
      const scaleFactor = Math.max(0, (blobScale - CFG.SCALE_BASE) / Math.max(0.001, CFG.SCALE_MAX - CFG.SCALE_BASE));
      blobMesh.scale.setScalar(blobScale);

      // — Nucleus voice tick — advance phrase step sequencer each frame
      if (audioCtx && nucleusBoopNode && !audioMuted && nucleusVoices.size > 0) {
        const now          = audioCtx.currentTime;
        const stepInterval = 1.0 / (tapLfoRate * 4);
        for (const [minterId, voice] of nucleusVoices) {
          if (now >= voice.nextStepAt) {
            if (voice.dying) {
              nucleusVoices.delete(minterId);
              if (minterId !== zoomedMinterId) dismissLabel(minterId); // keep zoom alive after sound ends
              continue;
            }
            const step = voice.phrase[voice.stepIdx];
            if (!step.isRest) {
              const maxCycles = voice.phrase.length;
              const fadeGain = 1.0 - voice.cycleCount / maxCycles;
              nucleusBoopNode.port.postMessage({ trigger: {
                freq:     step.freq,
                attackMs: step.attackMs || 20,
                decayMs:  step.decayMs,
                gain:     fadeGain * 0.7,
                type:     step.type || 'sine',
              }});
            }
            voice.activeIdx   = voice.stepIdx;
            voice.nextStepAt += stepInterval * step.stepLen;
            voice.stepIdx++;
            if (voice.stepIdx >= voice.phrase.length) {
              voice.stepIdx = 0;
              voice.cycleCount++;
              if (voice.cycleCount >= voice.phrase.length) voice.dying = true;
            }
          }
        }
      }

      // — Audio RMS — sampled every frame, drives blob visuals
      if (analyserNode && !audioMuted) {
        analyserNode.getByteTimeDomainData(waveData);
        let sum = 0;
        for (let i = 0; i < waveData.length; i++) { const v = (waveData[i] / 128.0) - 1.0; sum += v * v; }
        audioRMS = Math.sqrt(sum / waveData.length);
      } else { audioRMS *= 0.92; }

      blobMesh.reset();
      const audioBreath = 1.0 + audioRMS * 3.5;
      // Weak central cohesion — holds the blob together but doesn't dominate the shape
      const centralStr  = bStr * (0.5 + audioBreath * 0.2 + 0.1 * Math.sin(t * 2.1));
      const subtractVal = CFG.BLOB_SUBTRACT;
      blobMesh.addBall(0.5, 0.5, 0.5, centralStr, subtractVal);

      // 4 Lissajous balls always run — organic base shape from v6.
      // Fade out gradually as nuclei accumulate past ~12.
      const lissajousStr = bStr * 0.85 * Math.max(0, 1 - total / 12);
      if (lissajousStr > 0.01) {
        const cosG = Math.cos(gyroAngle), sinG = Math.sin(gyroAngle);
        for (let i = 0; i < 4; i++) {
          const phi = phaseOffsets[i], speed = 0.3 + i * 0.07;
          const r   = 0.12 + 0.04 * Math.sin(t * 1.1 + phi);
          const lx  = r * Math.cos(t * speed + phi);
          const lz  = r * Math.sin(t * speed * 0.5 + phi + 2.0);
          blobMesh.addBall(
            0.5 + lx * cosG - lz * sinG,
            0.5 + r * Math.sin(t * speed * 0.7 + phi + 1.0),
            0.5 + lx * sinG + lz * cosG,
            lissajousStr, subtractVal
          );
        }
      }

      if (total > 0) {
        // Each nucleus pushes a bump outward to the blob surface in its direction from centre.
        // Multiple nuclei in the same direction stack into a bigger lobe — the surface
        // follows the living constellation rather than averaging into a sphere.
        const surfStrBase = bStr * 1.2 / Math.max(1, Math.sqrt(total * 0.3));
        animFP.forEach((fp, i) => {
          const dx = fp.fx - 0.5, dy = fp.fy - 0.5, dz = fp.fz - 0.5;
          const len = Math.sqrt(dx*dx + dy*dy + dz*dz);
          if (len < 0.04) return;
          const ndx = dx/len, ndy = dy/len, ndz = dz/len;

          // Two axes perpendicular to nucleus direction — used for lateral flow
          const ax = Math.abs(ndx) < 0.9 ? 1 : 0, az = Math.abs(ndx) < 0.9 ? 0 : 1;
          const p1x = ndy*az - ndz*0, p1y = ndz*ax - ndx*az, p1z = ndx*0 - ndy*ax;
          const p1l = Math.sqrt(p1x*p1x + p1y*p1y + p1z*p1z) || 1;
          const t1x = p1x/p1l, t1y = p1y/p1l, t1z = p1z/p1l;
          const t2x = ndy*t1z - ndz*t1y, t2y = ndz*t1x - ndx*t1z, t2z = ndx*t1y - ndy*t1x;

          // Lateral drift — each nucleus flows at its own rate, irrational offset so no sync
          const flow = t * 0.35 + i * 1.13;
          const amt  = 0.07;
          const bx = ndx + t1x * Math.cos(flow) * amt + t2x * Math.sin(flow * 0.71) * amt;
          const by = ndy + t1y * Math.cos(flow) * amt + t2y * Math.sin(flow * 0.71) * amt;
          const bz = ndz + t1z * Math.cos(flow) * amt + t2z * Math.sin(flow * 0.71) * amt;
          const bl = Math.sqrt(bx*bx + by*by + bz*bz) || 1;

          // surfR sweeps 0.18–0.30 — nuclei at the high end poke out through the surface
          const surfR = 0.24 + 0.06 * Math.sin(t * 0.6 + i * 0.53);
          const str   = surfStrBase * (0.75 + 0.35 * Math.sin(t * 0.8 + i * 0.71));
          blobMesh.addBall(
            0.5 + (bx/bl) * surfR,
            0.5 + (by/bl) * surfR,
            0.5 + (bz/bl) * surfR,
            str, subtractVal
          );
        });
      }


      blobMesh.update();
      // — Gyroscope — membrane spins Y, scaffold counter-spins X (v17 pattern)
      gyroAngle    += gyroSpeed * 0.005;
      scaffoldAngle = -gyroAngle;
      blobMesh.rotation.y += gyroSpeed * 0.003;
      gyroSpeed     = 0.4 + (nucleusVoices.size / Math.max(1, minters.length)) * 3.6;

      // — Rim: heartbeat + minter colour tint + click flare —
      const baseRim = lightMode
        ? 1 + 0.3 * Math.sin(t * 5.0) * Math.sin(t * 0.8)
        : 0.65 + 0.2 * Math.sin(t * 5.0) * Math.sin(t * 0.8);
      orbMaterial.uniforms.rimIntensity.value = baseRim;
      orbMaterial.uniforms.rimPower.value = lightMode ? 2 : 3.0;
      orbMaterial.uniforms.rimColor.value
        .copy(rimBaseColor)
        .lerp(rimExhaleColor, isHolding ? 0.6 : 0);
      if (!lightMode) {
        bloomPass.enabled  = true;
        bloomPass.strength = Math.max(0.15, 0.35 - totalCount() * 0.002);
      }

      // — Ripple uniforms —
      const rippleAge = t - rippleStartTime;
      orbMaterial.uniforms.rippleCenter.value.copy(rippleTapPos);
      orbMaterial.uniforms.rippleTime.value    = rippleAge;
      orbMaterial.uniforms.rippleStrength.value = Math.max(0, 1.0 - rippleAge * 0.85);

      // — FPS —
      const now = performance.now();
      fpsSmooth = Math.round(0.9 * fpsSmooth + 0.1 * (1000 / (now - lastFrameMs)));
      lastFrameMs = now;

      // — Label zoom lerp + clump tracking —
      // controls.update() is skipped entirely while zoomed — it rewrites camera.position
      // from its internal spherical state even when disabled, causing drift.
      if (camLerp) {
        // While zooming IN, chase the live clump so there's no jolt when tracking starts
        if (zoomedMinterId !== null) {
          const zc = nucleiMeshes.filter(m => m.userData.minterId === zoomedMinterId);
          if (zc.length) {
            const livePos = new THREE.Vector3();
            zc.forEach(m => livePos.add(m.position));
            livePos.divideScalar(zc.length);
            camLerp.toLook.copy(livePos);
            const dir = camera.position.clone().sub(livePos).normalize();
            camLerp.toPos.copy(livePos).addScaledVector(dir, ZOOM_DIST);
          }
        }
        camera.position.lerp(camLerp.toPos, ZOOM_LERP_SPEED);
        controls.target.lerp(camLerp.toLook, ZOOM_LERP_SPEED);
        camera.lookAt(controls.target);
        if (camera.position.distanceTo(camLerp.toPos) < ZOOM_SNAP_DIST) {
          camera.position.copy(camLerp.toPos);
          controls.target.copy(camLerp.toLook);
          camera.lookAt(controls.target);
          const cb = camLerp.onComplete;
          camLerp = null;
          if (cb) cb();
        }
      } else if (zoomedMinterId !== null) {
        // Settled zoom: track clump as the centre of the universe each frame
        const zClumpMeshes = nucleiMeshes.filter(m => m.userData.minterId === zoomedMinterId);
        if (zClumpMeshes.length) {
          const zClumpPos = new THREE.Vector3();
          zClumpMeshes.forEach(m => zClumpPos.add(m.position));
          zClumpPos.divideScalar(zClumpMeshes.length);
          const delta = zClumpPos.clone().sub(controls.target);
          camera.position.add(delta);
          controls.target.copy(zClumpPos);
          camera.lookAt(zClumpPos);
        }
      } else {
        controls.update(); // normal orbit — only runs when not zoomed
      }
      updateLabels();
      composer.render();
    }

    renderer.setAnimationLoop(animLoop);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        renderer.setAnimationLoop(null);
      } else {
        _lastFrameTime = 0;
        renderer.setAnimationLoop(animLoop);
      }
    });
  </script>
</body>
</html>
